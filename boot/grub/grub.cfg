set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
search --no-floppy --file /loader.elf --set=root
if [ -f ($root)/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=1024x768x32
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm
set theme=($root)/grub/theme/theme.txt
export theme

menuentry "ReliefOS" {
    set root=(hd0,gpt1)
    multiboot2 /reliefos/loader.elf root=/ log=screen,serial
    module2 /reliefos/kernel.sys reliefos-kernel
    boot
}

menuentry "ReliefOS (console log)" {
    set root=(hd0,gpt1)
    multiboot2 /reliefos/loader.elf root=/ log=screen,serial bootlog=1
    module2 /reliefos/kernel.sys reliefos-kernel
    boot
}

menuentry "ReliefOS (with boot log)" {
    set root=(hd0,gpt1)
    multiboot2 /reliefos/loader.elf root=/ log=screen,serial bootlog=1 bootlog-pause=1
    module2 /reliefos/kernel.sys reliefos-kernel
    boot
}

menuentry "ReliefOS (debug mode)" {
    set root=(hd0,gpt1)
    multiboot2 /reliefos/loader.elf root=/ log=screen,serial bootlog=1 debug=1 autospawn=hello autospawn=uidemo autospawn=memtest
    module2 /reliefos/kernel.sys reliefos-kernel
    boot
}

menuentry "ReliefOS (SVGA II 3D test)" {
    set root=(hd0,gpt1)
    multiboot2 /reliefos/loader.elf root=/ log=screen,serial svga3d-triangle=1 bootlog=1 bootlog-pause=1
    module2 /reliefos/kernel.sys reliefos-kernel
    boot
}

menuentry "ReliefOS (legacy rollback)" {
    set root=(hd0,gpt1)
    multiboot2 /loader.elf root=/ log=screen,serial
    module2 /leonos/kernel.sys leonos-kernel
    boot
}

menuentry "Reboot" {
    reboot
}
