# ReliefOS minimal Xorg configuration.
#
# Only the standard Linux fbdev and evdev interfaces are used: the display is
# the fixed framebuffer /dev/fb0, the keyboard is /dev/input/event0 and the
# mouse is /dev/input/event1. The server runs on VT1 (tty1), which the session
# wrapper pins with `Xorg -vt 1 -keeptty`. No udev enumeration,
# DRM/KMS, Mesa modesetting, libinput or Wayland is involved.

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection

Section "ServerLayout"
    Identifier "reliefos-layout"
    Screen 0 "reliefos-screen"
    InputDevice "reliefos-keyboard" "CoreKeyboard"
    InputDevice "reliefos-mouse" "CorePointer"
EndSection

Section "Device"
    Identifier "reliefos-fbdev"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "reliefos-monitor"
EndSection

Section "Screen"
    Identifier "reliefos-screen"
    Device "reliefos-fbdev"
    Monitor "reliefos-monitor"
    DefaultDepth 24
    DefaultFbBpp 32
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "reliefos-keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "GrabDevice" "true"
EndSection

Section "InputDevice"
    Identifier "reliefos-mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "GrabDevice" "true"
    Option "Emulate3Buttons" "false"
EndSection
