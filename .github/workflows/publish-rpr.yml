name: Publish LeonOS RPR

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leonos-rpr-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build meson clang libclang-rt-dev llvm lld \
            grub-efi-amd64-bin grub-pc-bin grub-common xorriso mtools \
            dosfstools e2fsprogs fakeroot gdisk qemu-utils python3 python3-pil \
            git make bison flex bc pkg-config autoconf automake libtool \
            libtool-bin gawk ncurses-bin exfatprogs openssl

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-none

      - name: Import APK signing key
        id: signing_key
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.LEONOS_APK_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$APK_SIGNING_KEY_B64" || {
            echo 'Missing GitHub Secret: LEONOS_APK_SIGNING_KEY_B64' >&2
            exit 1
          }
          key_path="$RUNNER_TEMP/leonos-rpr-signing-key.rsa"
          umask 077
          printf '%s' "$APK_SIGNING_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          openssl pkey -in "$key_path" -noout -check >/dev/null
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build signed RPR site
        env:
          LEONOS_APK_SIGNING_KEY: ${{ steps.signing_key.outputs.path }}
        run: |
          set -euo pipefail
          python3 ./build.py run defconfig
          python3 ./build.py run rpr-pages

      - name: Verify publication boundary
        run: |
          set -euo pipefail
          test -s build/rpr-pages/apk/packages.adb
          test -s build/rpr-pages/apk/leonos-rpr.rsa.pub
          test -s build/rpr-pages/kernel/kernel.sys
          test -s build/rpr-pages/kernel/middlelayer.sys
          test -s build/rpr-pages/kernel/release.txt
          if grep -R -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' build/rpr-pages; then
            echo 'Private key material reached the Pages directory' >&2
            exit 1
          fi

      - name: Remove private key
        if: always() && steps.signing_key.outputs.path != ''
        env:
          KEY_PATH: ${{ steps.signing_key.outputs.path }}
        run: rm -f -- "$KEY_PATH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/rpr-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
