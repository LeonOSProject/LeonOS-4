name: Sync branches to SourceHut

on:
  push:
    branches:
      - "**"
  delete:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-flight sync: a later push must wait for the earlier
# force-push instead of allowing two branch sets to race on SourceHut.
concurrency:
  group: leonos4-sourcehut-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Force-sync all branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # Hard-coded SourceHut targets. One SSH key (SOURCEHUT_SSH_PRIVATE_KEY)
      # is authorized on every host below. Add or remove entries here as
      # needed; the sync step loops over them automatically.
      #
      # Supported URL forms:
      #   git@host:~user/repo                 (default SSH port 22)
      #   ssh://git@host:PORT/~user/repo      (custom SSH port)
      SOURCEHUT_REPOSITORIES: >-
        git@git.sr.ht:~leonmmcoset/LeonOS-4,
        ssh://git@git.hgspace.work:2222/~leonmmcoset/LeonOS-4.git

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          # A delete event has no checkout-able deleted ref. The explicit
          # fetch below is authoritative, so use the current default branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: false
          # The checkout token is needed for the explicit all-branches fetch.
          persist-credentials: true

      - name: Configure SourceHut SSH
        env:
          SOURCEHUT_SSH_PRIVATE_KEY: ${{ secrets.SOURCEHUT_SSH_PRIVATE_KEY }}
          SOURCEHUT_EXTRA_KNOWN_HOSTS: ${{ secrets.SOURCEHUT_EXTRA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SOURCEHUT_SSH_PRIVATE_KEY" || {
            echo "Missing required secret: SOURCEHUT_SSH_PRIVATE_KEY" >&2
            exit 1
          }

          # --- Parse the comma-separated repository list ---
          repos=()
          while IFS= read -r repo; do
            repo="${repo#"${repo%%[![:space:]]*}"}"
            repo="${repo%"${repo##*[![:space:]]}"}"
            [ -n "$repo" ] && repos+=("$repo")
          done < <(printf '%s\n' "$SOURCEHUT_REPOSITORIES" | tr ',' '\n')

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "SOURCEHUT_REPOSITORIES did not contain any repository" >&2
            exit 1
          fi

          # Parse a git SSH URL into "host" and "port".
          #
          #   ssh://git@host:PORT/path   -> host, PORT       (PORT defaults 22)
          #   git@host:path              -> host, 22         (scp-like)
          #
          # Output: one line for host, one line for port.
          repo_host_port() {
            local url="$1" rest hostpart host port
            case "$url" in
              ssh://*@*/*)
                rest="${url#ssh://}"
                rest="${rest#*@}"
                hostpart="${rest%%/*}"
                ;;
              *@*:*)
                rest="${url#*@}"
                hostpart="${rest%%:*}"
                port="22"
                ;;
              *)
                return 1
                ;;
            esac

            case "${port:-}" in
              "")
                # ssh:// form: hostpart may be "host", "host:port" or "[v6]:port"
                case "$hostpart" in
                  \[*\]:*)
                    host="${hostpart%%]*}]"
                    port="${hostpart##*:}"
                    ;;
                  *:*)
                    host="${hostpart%%:*}"
                    port="${hostpart##*:}"
                    ;;
                  *)
                    host="$hostpart"
                    port="22"
                    ;;
                esac
                ;;
            esac

            [ -n "$host" ] || return 1
            [ -n "$port" ] || port="22"
            case "$port" in
              *[!0-9]*|"") echo "Invalid SSH port in URL: $url" >&2; return 1 ;;
            esac

            printf '%s\n%s\n' "$host" "$port"
          }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SOURCEHUT_SSH_PRIVATE_KEY" > "$HOME/.ssh/sourcehut_sync_key"
          chmod 600 "$HOME/.ssh/sourcehut_sync_key"

          known_hosts="$HOME/.ssh/known_hosts"
          : > "$known_hosts"

          # Pinned git.sr.ht host keys (port 22 only). Keeping
          # StrictHostKeyChecking enabled prevents a network interception
          # from receiving the sync key.
          printf '%s\n' \
            'git.sr.ht ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZvRd4EtM7R+IHVMWmDkVU3VLQTSwQDSAvW0t2Tkj60' \
            'git.sr.ht ssh-rsa ' \
            'git.sr.ht ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCj6y+cJlqK3BHZRLZuM+KP2zGPrh4H66DacfliU1E2DHAd1GGwF4g1jwu3L8gOZUTIvUptqWTkmglpYhFp4Iy4=' \
            >> "$known_hosts"

          # Optional host keys for self-hosted SourceHut instances, in
          # known_hosts format, one entry per line. For non-default ports,
          # use the "[host]:port keytype base64..." form, e.g.:
          #   [git.hgspace.work]:2222 ssh-ed25519 AAAA...
          if [ -n "${SOURCEHUT_EXTRA_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SOURCEHUT_EXTRA_KNOWN_HOSTS" >> "$known_hosts"
          fi

          # Register one git remote per repository and collect the host set.
          declare -A seen_hosts=()
          for i in "${!repos[@]}"; do
            repo="${repos[$i]}"
            mapfile -t hp < <(repo_host_port "$repo") || {
              echo "SOURCEHUT_REPOSITORIES entry #$((i + 1)) is not a valid git SSH URL: $repo" >&2
              exit 1
            }
            if [ "${#hp[@]}" -lt 2 ] || [ -z "${hp[0]}" ]; then
              echo "SOURCEHUT_REPOSITORIES entry #$((i + 1)) is not a valid git SSH URL: $repo" >&2
              exit 1
            fi
            host="${hp[0]}"
            port="${hp[1]}"

            # known_hosts uses "[host]:port" for non-default ports.
            if [ "$port" = "22" ]; then
              key="$host"
            else
              key="[$host]:$port"
            fi
            seen_hosts["$key|$host|$port"]=1

            git remote add "sourcehut-$i" "$repo"
          done

          # Ensure every host has at least one trusted key. git.sr.ht and any
          # host covered by SOURCEHUT_EXTRA_KNOWN_HOSTS are already present;
          # everything else falls back to ssh-keyscan (trust on first use).
          for entry in "${!seen_hosts[@]}"; do
            key="${entry%%|*}"
            rest="${entry#*|}"
            host="${rest%%|*}"
            port="${rest##*|}"

            if ssh-keygen -F "$key" -f "$known_hosts" >/dev/null 2>&1; then
              continue
            fi
            echo "WARNING: no pinned host key for $key, falling back to ssh-keyscan" >&2
            if ! ssh-keyscan -T 10 -p "$port" -t rsa,ecdsa,ed25519 "$host" >> "$known_hosts" 2>/dev/null; then
              echo "Failed to fetch host keys for $key" >&2
              exit 1
            fi
          done
          chmod 600 "$known_hosts"

          git config --local core.sshCommand \
            "ssh -i $HOME/.ssh/sourcehut_sync_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"

          # Expose the count to later steps (GITHUB_ENV persists across steps).
          echo "SOURCEHUT_SYNC_COUNT=${#repos[@]}" >> "$GITHUB_ENV"

      - name: Fetch every GitHub branch
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/sync/github/*'
          test -n "$(git for-each-ref --format='%(refname)' refs/sync/github/)"

      - name: Force-sync and prune SourceHut branches
        run: |
          set -euo pipefail

          count="${SOURCEHUT_SYNC_COUNT:?SOURCEHUT_SYNC_COUNT is not set}"

          for ((i = 0; i < count; i++)); do
            remote="sourcehut-$i"
            echo "Force-syncing branches to $remote ($(git remote get-url "$remote"))"
            git push --force --prune "$remote" \
              'refs/sync/github/*:refs/heads/*'
          done