name: Sync branches to SourceHut

on:
  push:
    branches:
      - "**"
  delete:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-flight sync: a later push must wait for the earlier
# force-push instead of allowing two branch sets to race on SourceHut.
concurrency:
  group: leonos4-sourcehut-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Force-sync all branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          # A delete event has no checkout-able deleted ref. The explicit
          # fetch below is authoritative, so use the current default branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: false
          # The checkout token is needed for the explicit all-branches fetch.
          persist-credentials: true

      - name: Configure SourceHut SSH
        env:
          SOURCEHUT_REPOSITORIES: ${{ secrets.SOURCEHUT_REPOSITORIES }}
          SOURCEHUT_SSH_PRIVATE_KEYS: ${{ secrets.SOURCEHUT_SSH_PRIVATE_KEYS }}
        run: |
          set -euo pipefail

          test -n "$SOURCEHUT_REPOSITORIES" || {
            echo "Missing required secret: SOURCEHUT_REPOSITORIES" >&2
            exit 1
          }
          test -n "$SOURCEHUT_SSH_PRIVATE_KEYS" || {
            echo "Missing required secret: SOURCEHUT_SSH_PRIVATE_KEYS" >&2
            exit 1
          }

          # --- Parse the comma-separated repository list ---
          repos=()
          while IFS= read -r repo; do
            # Trim leading/trailing whitespace.
            repo="${repo#"${repo%%[![:space:]]*}"}"
            repo="${repo%"${repo##*[![:space:]]}"}"
            [ -n "$repo" ] && repos+=("$repo")
          done < <(printf '%s\n' "$SOURCEHUT_REPOSITORIES" | tr ',' '\n')

          # --- Parse the comma-separated key list ---
          # Keys contain newlines, so split on the delimiter rather than on
          # newlines; IFS= prevents read from stripping surrounding spaces.
          keys=()
          while IFS= read -r -d ',' key; do
            keys+=("$key")
          done < <(printf '%s,' "$SOURCEHUT_SSH_PRIVATE_KEYS")

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "SOURCEHUT_REPOSITORIES did not contain any repository" >&2
            exit 1
          fi
          if [ "${#repos[@]}" -ne "${#keys[@]}" ]; then
            echo "Expected one SSH key per repository, got ${#repos[@]} repositories and ${#keys[@]} keys" >&2
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"

          # Pinned git.sr.ht host keys. Keeping StrictHostKeyChecking enabled
          # prevents a network interception from receiving the sync keys.
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          git.sr.ht ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZvRd4EtM7R+IHVMWmDkVU3VLQTSwQDSAvW0t2Tkj60
          git.sr.ht ssh-rsa 
          git.sr.ht ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCj6y+cJlqK3BHZRLZuM+KP2zGPrh4H66DacfliU1E2DHAd1GGwF4g1jwu3L8gOZUTIvUptqWTkmglpYhFp4Iy4=
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

          for i in "${!repos[@]}"; do
            repo="${repos[$i]}"
            key="${keys[$i]}"

            case "$repo" in
              git@git.sr.ht:~*/*|ssh://git@git.sr.ht/~*/*) ;;
              *)
                echo "SOURCEHUT_REPOSITORIES entry #$((i + 1)) must be git@git.sr.ht:~user/repository, got: $repo" >&2
                exit 1
                ;;
            esac

            # Trim surrounding whitespace/newlines from the key.
            key="${key#"${key%%[![:space:]]*}"}"
            key="${key%"${key##*[![:space:]]}"}"

            keyfile="$HOME/.ssh/sourcehut_sync_key_$i"
            printf '%s\n' "$key" > "$keyfile"
            chmod 600 "$keyfile"

            git remote add "sourcehut-$i" "$repo"
          done

          # Expose the count to later steps (GITHUB_ENV persists across steps).
          echo "SOURCEHUT_SYNC_COUNT=${#repos[@]}" >> "$GITHUB_ENV"

      - name: Fetch every GitHub branch
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/sync/github/*'
          test -n "$(git for-each-ref --format='%(refname)' refs/sync/github/)"

      - name: Force-sync and prune SourceHut branches
        run: |
          set -euo pipefail

          count="${SOURCEHUT_SYNC_COUNT:?SOURCEHUT_SYNC_COUNT is not set}"

          for ((i = 0; i < count; i++)); do
            keyfile="$HOME/.ssh/sourcehut_sync_key_$i"
            remote="sourcehut-$i"

            echo "Force-syncing branches to $remote"
            GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              git push --force --prune "$remote" \
                'refs/sync/github/*:refs/heads/*'
          done