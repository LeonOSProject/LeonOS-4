name: Sync branches to SourceHut

on:
  push:
    branches:
      - "**"
  delete:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-flight sync.
# A later push must wait for the earlier force-push to finish,
# preventing two branch sets from racing on SourceHut.
concurrency:
  group: leonos4-sourcehut-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Force-sync all branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # Comma-separated SourceHut targets.
      #
      # Supported SSH URL forms:
      #
      #   git@host:~user/repo
      #   ssh://git@host/~user/repo
      #   ssh://git@host:PORT/~user/repo
      #   ssh://git@[v6addr]:PORT/~user/repo
      #
      # One SSH private key is authorized on every target.
      SOURCEHUT_REPOSITORIES: >-
        git@git.sr.ht:~leonmmcoset/LeonOS-4,
        ssh://git@git.hgspace.work:2222/~leonmmcoset/LeonOS-4.git

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      #
      # A delete event does not provide a usable branch ref for checkout.
      # The explicit all-branches fetch below is authoritative, so use the
      # repository's current default branch here.
      #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: true

      # ------------------------------------------------------------------
      # Configure SSH and SourceHut remotes
      # ------------------------------------------------------------------
      #
      - name: Configure SourceHut SSH
        env:
          SOURCEHUT_SSH_PRIVATE_KEY: ${{ secrets.SOURCEHUT_SSH_PRIVATE_KEY }}
          SOURCEHUT_EXTRA_KNOWN_HOSTS: ${{ secrets.SOURCEHUT_EXTRA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${SOURCEHUT_SSH_PRIVATE_KEY:-}" ]; then
            echo "ERROR: Missing required secret: SOURCEHUT_SSH_PRIVATE_KEY" >&2
            exit 1
          fi

          # --------------------------------------------------------------
          # Parse the comma-separated repository list.
          # --------------------------------------------------------------
          repos=()

          while IFS= read -r repo; do
            # Trim leading whitespace.
            repo="${repo#"${repo%%[![:space:]]*}"}"

            # Trim trailing whitespace.
            repo="${repo%"${repo##*[![:space:]]}"}"

            if [ -n "$repo" ]; then
              repos+=("$repo")
            fi
          done < <(
            printf '%s\n' "$SOURCEHUT_REPOSITORIES" |
              tr ',' '\n'
          )

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "ERROR: SOURCEHUT_REPOSITORIES contains no repositories" >&2
            exit 1
          fi

          # --------------------------------------------------------------
          # Parse a Git SSH URL into:
          #
          #   host
          #   port
          #
          # Supported:
          #
          #   git@host:path
          #   ssh://git@host/path
          #   ssh://git@host:2222/path
          #   ssh://git@[2001:db8::1]:2222/path
          #
          # Output:
          #
          #   line 1 = host
          #   line 2 = port
          # --------------------------------------------------------------
          repo_host_port() {
            local url="$1"
            local rest
            local hostpart
            local host
            local port

            case "$url" in
              ssh://*@*/*)
                rest="${url#ssh://}"
                rest="${rest#*@}"
                hostpart="${rest%%/*}"

                case "$hostpart" in
                  \[*\]:*)
                    # IPv6:
                    # [2001:db8::1]:2222
                    host="${hostpart#\[}"
                    host="${host%%\]:*}"
                    port="${hostpart##*\]:}"
                    ;;

                  *:*)
                    # Normal host:
                    # example.com:2222
                    host="${hostpart%%:*}"
                    port="${hostpart##*:}"
                    ;;

                  *)
                    host="$hostpart"
                    port="22"
                    ;;
                esac
                ;;

              *@*:*)
                # SCP-like form:
                #
                # git@host:path
                #
                # SCP-style Git URLs do not support an explicit port.
                rest="${url#*@}"
                host="${rest%%:*}"
                port="22"
                ;;

              *)
                echo "ERROR: unsupported SSH URL format: $url" >&2
                return 1
                ;;
            esac

            if [ -z "$host" ]; then
              echo "ERROR: empty SSH host in URL: $url" >&2
              return 1
            fi

            if [ -z "$port" ]; then
              port="22"
            fi

            case "$port" in
              ''|*[!0-9]*)
                echo "ERROR: invalid SSH port in URL: $url" >&2
                return 1
                ;;
            esac

            if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
              echo "ERROR: SSH port out of range in URL: $url" >&2
              return 1
            fi

            printf '%s\n%s\n' "$host" "$port"
          }

          # --------------------------------------------------------------
          # Prepare ~/.ssh
          # --------------------------------------------------------------
          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SOURCEHUT_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/sourcehut_sync_key"

          chmod 600 "$HOME/.ssh/sourcehut_sync_key"

          known_hosts="$HOME/.ssh/known_hosts"

          # Do not inherit runner/user host keys.
          # This workflow intentionally maintains its own trust store.
          : > "$known_hosts"

          # --------------------------------------------------------------
          # Pinned git.sr.ht host keys.
          #
          # These are trusted explicitly instead of using ssh-keyscan.
          # --------------------------------------------------------------
          cat >> "$known_hosts" <<'EOF'
          git.sr.ht ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZvRd4EtM7R+IHVMWmDkVU3VLQTSwQDSAvW0t2Tkj60
          git.sr.ht ssh-rsa 
          git.sr.ht ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCj6y+cJlqK3BHZRLZuM+KP2zGPrh4H66DacfliU1E2DHAd1GGwF4g1jwu3L8gOZUTIvUptqWTkmglpYhFp4Iy4=
          EOF

          # --------------------------------------------------------------
          # Optional pinned host keys for self-hosted SourceHut instances.
          #
          # Example:
          #
          #   [git.hgspace.work]:2222 ssh-ed25519 AAAA...
          #
          # IMPORTANT:
          #
          # We intentionally do NOT fall back to ssh-keyscan.
          # An unknown host key causes the workflow to fail instead.
          # --------------------------------------------------------------
          if [ -n "${SOURCEHUT_EXTRA_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SOURCEHUT_EXTRA_KNOWN_HOSTS" >> "$known_hosts"
          fi

          chmod 600 "$known_hosts"

          # --------------------------------------------------------------
          # Register one Git remote per SourceHut repository.
          # --------------------------------------------------------------
          declare -A seen_hosts=()

          for i in "${!repos[@]}"; do
            repo="${repos[$i]}"

            mapfile -t hp < <(
              repo_host_port "$repo"
            ) || {
              echo "ERROR: invalid SourceHut repository #$((i + 1)): $repo" >&2
              exit 1
            }

            if [ "${#hp[@]}" -lt 2 ]; then
              echo "ERROR: failed to parse SourceHut repository #$((i + 1)): $repo" >&2
              exit 1
            fi

            host="${hp[0]}"
            port="${hp[1]}"

            # known_hosts uses:
            #
            #   host
            #
            # for port 22, and:
            #
            #   [host]:port
            #
            # for custom ports.
            if [ "$port" = "22" ]; then
              key="$host"
            else
              key="[$host]:$port"
            fi

            seen_hosts["$key|$host|$port"]=1

            remote="sourcehut-$i"

            echo "Adding remote $remote -> $repo"

            git remote remove "$remote" 2>/dev/null || true
            git remote add "$remote" "$repo"
          done

          # --------------------------------------------------------------
          # Verify that every target host has a pinned host key.
          #
          # There is intentionally NO ssh-keyscan fallback.
          # --------------------------------------------------------------
          for entry in "${!seen_hosts[@]}"; do
            key="${entry%%|*}"

            rest="${entry#*|}"
            host="${rest%%|*}"
            port="${rest##*|}"

            if ! ssh-keygen -F "$key" -f "$known_hosts" >/dev/null 2>&1; then
              echo "ERROR: no pinned SSH host key for $key" >&2
              echo "Add the host key to SOURCEHUT_EXTRA_KNOWN_HOSTS." >&2
              exit 1
            fi

            echo "Verified pinned SSH host key for $key"
          done

          # --------------------------------------------------------------
          # Force Git to use only the dedicated SourceHut key and trust
          # only the workflow-specific known_hosts file.
          # --------------------------------------------------------------
          git config --local core.sshCommand \
            "ssh \
              -i $HOME/.ssh/sourcehut_sync_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=$known_hosts"

          echo "SOURCEHUT_SYNC_COUNT=${#repos[@]}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Fetch every GitHub branch into a private synchronization namespace.
      #
      # Example:
      #
      #   GitHub:
      #     refs/heads/main
      #     refs/heads/rewrite/kernel
      #
      #   Local:
      #     refs/sync/github/main
      #     refs/sync/github/rewrite/kernel
      #
      # Tags are intentionally not fetched or synchronized.
      # ------------------------------------------------------------------
      - name: Fetch every GitHub branch
        run: |
          set -euo pipefail

          git fetch \
            --force \
            --prune \
            origin \
            '+refs/heads/*:refs/sync/github/*'

          if ! git for-each-ref \
            --format='%(refname)' \
            refs/sync/github/ |
            grep -q .; then
            echo "ERROR: GitHub branch fetch produced no branches" >&2
            exit 1
          fi

          echo "GitHub branches to synchronize:"
          git for-each-ref \
            --format='  %(refname:strip=2)' \
            refs/sync/github/

      # ------------------------------------------------------------------
      # Force-sync and prune every configured SourceHut repository.
      #
      # SourceHut becomes an exact branch mirror of GitHub:
      #
      #   GitHub branch exists
      #       -> SourceHut branch exists at same commit
      #
      #   GitHub branch moved
      #       -> SourceHut branch is force-updated
      #
      #   GitHub branch deleted
      #       -> SourceHut branch is deleted
      #
      # Tags are intentionally untouched.
      # ------------------------------------------------------------------
      - name: Force-sync and prune SourceHut branches
        run: |
          set -euo pipefail

          count="${SOURCEHUT_SYNC_COUNT:?SOURCEHUT_SYNC_COUNT is not set}"

          if [ "$count" -lt 1 ]; then
            echo "ERROR: no SourceHut repositories configured" >&2
            exit 1
          fi

          for ((i = 0; i < count; i++)); do
            remote="sourcehut-$i"
            url="$(git remote get-url "$remote")"

            echo
            echo "============================================================"
            echo "Force-syncing branches to:"
            echo "  $remote"
            echo "  $url"
            echo "============================================================"

            git push \
              --force \
              --prune \
              "$remote" \
              'refs/sync/github/*:refs/heads/*'

            echo "Successfully synchronized $remote"
          done

          echo
          echo "SourceHut branch synchronization completed successfully."